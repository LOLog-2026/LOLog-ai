[project]
name = "lolog-ai"
version = "0.1.0"
description = "LOLog AI: 웃긴 대화 탐지·요약·4컷만화 생성 모델 실험"
readme = "README.md"
requires-python = ">=3.10"
# 맥·CI에서 `uv sync`로 까는 개발·테스트용 목록이다. 모델을 돌리는 패키지(torch, diffusers, qwen-tts 등)는
# 젯슨 역할별 목록 deploy/requirements-*.txt에 있다(젯슨은 uv sync를 쓰지 않는다. deploy/README.md).
dependencies = [
    "redis>=5.0",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.7",
    # 테스트가 쓰는 것. 워커에서는 3호(video)만 쓴다
    "soundfile>=0.12",
    "av>=12.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
